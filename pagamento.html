
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finalizar Compra - AMG Sports</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .checkout {
      max-width: 850px;
      margin: 120px auto 50px;
      padding: 30px;
      background: #111;
      border-radius: 18px;
    }

    .checkout h1 {
      color: #0066ff;
      text-align: center;
      margin-bottom: 30px;
    }

    .produto {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 15px 0;
      border-bottom: 1px solid #333;
    }

    .produto button {
      background: #ff4444;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 5px;
      cursor: pointer;
    }

    .total {
      font-size: 25px;
      text-align: right;
      margin: 25px 0;
      font-weight: bold;
    }

    .checkout h2 {
      color: #0066ff;
      margin: 25px 0 15px;
    }

    .endereco-box {
      background: #050505;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 18px;
      line-height: 1.8;
    }

    .endereco-box a {
      color: #1680ff;
      display: inline-block;
      margin-top: 10px;
    }

    .pagamento-opcao {
      display: block;
      padding: 15px;
      background: #050505;
      border: 1px solid #333;
      border-radius: 8px;
      margin: 10px 0;
      cursor: pointer;
    }

    .pagamento-opcao:has(input:checked) {
      border-color: #0066ff;
    }

    .checkout button.finalizar {
      width: 100%;
      padding: 16px;
      background: #0066ff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
    }

    .checkout button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #resultado {
      text-align: center;
      margin-top: 20px;
      line-height: 1.7;
    }

    .voltar {
      display: block;
      text-align: center;
      color: #0066ff;
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <main class="checkout">
    <h1>Finalizar Compra</h1>

    <h2>Seu carrinho</h2>
    <div id="lista-produtos"></div>

    <div class="total">
      Total: <span id="valor-total">R$ 0,00</span>
    </div>

    <h2>Endereço de entrega</h2>

    <div class="endereco-box" id="area-endereco">
      Carregando seu endereço...
    </div>

    <h2>Forma de pagamento</h2>

    <label class="pagamento-opcao">
      <input type="radio" name="pagamento" value="Mercado Pago" checked>
      💙 Mercado Pago (simulado)
    </label>

    <label class="pagamento-opcao">
      <input type="radio" name="pagamento" value="Pix">
      ⚡ Pix (simulado)
    </label>

    <label class="pagamento-opcao">
      <input type="radio" name="pagamento" value="Cartão de crédito">
      💳 Cartão de crédito (simulado)
    </label>

    <label class="pagamento-opcao">
      <input type="radio" name="pagamento" value="Cartão de débito">
      💳 Cartão de débito (simulado)
    </label>

    <button class="finalizar" id="finalizar" disabled>
      Confirmar compra
    </button>

    <div id="resultado" role="status" aria-live="polite"></div>

    <a href="index.html" class="voltar">← Voltar à loja</a>
  </main>

  <script type="module">
    import { createClient } from
      "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL =
      "https://yjlbkermtbnbrhfnbywy.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_nbg_3n1Z9u3fs4DM_i3j4Q_W03ULN4E";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    // ELEMENTOS
    const lista = document.getElementById("lista-produtos");
    const totalEl = document.getElementById("valor-total");
    const resultado = document.getElementById("resultado");
    const finalizar = document.getElementById("finalizar");
    const areaEndereco = document.getElementById("area-endereco");

    // CARRINHO
    let carrinho = [];

    try {
      carrinho = JSON.parse(
        localStorage.getItem("amg-cart")
      ) || [];

      if (!Array.isArray(carrinho)) {
        carrinho = [];
      }
    } catch (e) {
      carrinho = [];
    }

    let enderecoCarregado = false;

    function formatar(valor) {
      return valor.toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
      });
    }

    function salvar() {
      localStorage.setItem(
        "amg-cart",
        JSON.stringify(carrinho)
      );
    }

    // ATUALIZAR CARRINHO
    function atualizarCarrinho() {
      lista.innerHTML = "";

      let total = 0;
      let quantidadeValida = 0;

      carrinho.forEach((item, index) => {
        const preco = Number(item.preco);
        const qtd = Number(item.qtd);

        if (
          !item.nome ||
          !Number.isFinite(preco) ||
          !Number.isSafeInteger(qtd) ||
          qtd < 1 ||
          preco < 0
        ) return;

        quantidadeValida++;
        total += preco * qtd;

        const produto = document.createElement("div");
        produto.className = "produto";

        const descricao = document.createElement("span");

        descricao.textContent =
          `${item.nome} x${qtd} - ${formatar(preco * qtd)}`;

        const remover = document.createElement("button");

        remover.textContent = "Remover";

        remover.addEventListener("click", () => {
          carrinho.splice(index, 1);
          salvar();
          resultado.textContent = "";
          atualizarCarrinho();
        });

        produto.append(descricao, remover);
        lista.appendChild(produto);
      });

      if (quantidadeValida === 0) {
        lista.textContent = "Seu carrinho está vazio.";
      }

      totalEl.textContent = formatar(total);

      finalizar.disabled =
        quantidadeValida === 0 || !enderecoCarregado;
    }

    // BUSCAR ENDEREÇO DO CLIENTE
    async function carregarEndereco() {
      try {
        const { data: usuarioData, error: erroUsuario } =
          await supabase.auth.getUser();

        if (erroUsuario || !usuarioData.user) {
          areaEndereco.textContent =
            "Você precisa entrar na sua conta para continuar.";

          const link = document.createElement("a");
          link.href = "login.html";
          link.textContent = "Fazer login";

          areaEndereco.appendChild(link);
          return;
        }

        const usuario = usuarioData.user;

        const { data, error } = await supabase
          .from("addresses")
          .select("cep, rua, numero, complemento, bairro, cidade, estado")
          .eq("user_id", usuario.id)
          .order("created_at", { ascending: false })
          .limit(1);

        if (error) throw error;

        if (!data || data.length === 0) {
          areaEndereco.textContent =
            "Você ainda não cadastrou um endereço.";

          const link = document.createElement("a");
          link.href = "endereco.html";
          link.textContent = "Cadastrar meu endereço";

          areaEndereco.appendChild(link);
          return;
        }

        const endereco = data[0];

        const linhas = [
          `${endereco.rua}, ${endereco.numero}`,
          endereco.complemento,
          endereco.bairro,
          `${endereco.cidade} - ${endereco.estado}`,
          `CEP: ${endereco.cep}`
        ].filter(Boolean);

        areaEndereco.replaceChildren();

        linhas.forEach((linha) => {
          const div = document.createElement("div");
          div.textContent = linha;
          areaEndereco.appendChild(div);
        });

        const link = document.createElement("a");
        link.href = "endereco.html";
        link.textContent = "Alterar endereço";

        areaEndereco.appendChild(link);

        enderecoCarregado = true;

      } catch (error) {
        areaEndereco.textContent =
          "Não foi possível carregar seu endereço: " +
          error.message;
      }

      atualizarCarrinho();
    }

    // FINALIZAR COMPRA SIMULADA
    finalizar.addEventListener("click", () => {
      if (carrinho.length === 0 || !enderecoCarregado) {
        return;
      }

      const forma = document.querySelector(
        'input[name="pagamento"]:checked'
      ).value;

      resultado.style.color = "#00cc66";

      resultado.textContent =
        "✓ Compra simulada realizada com sucesso! " +
        "Forma de pagamento: " + forma +
        ". Obrigado por comprar na AMG Sports!";

      carrinho = [];
      salvar();
      atualizarCarrinho();

      finalizar.textContent = "Compra concluída!";
    });

    // INICIAR
    atualizarCarrinho();
    carregarEndereco();

  </script>

</body>
</html>
