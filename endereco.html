
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu endereço - AMG Sports</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .endereco-container {
      max-width: 550px;
      margin: 120px auto 50px;
      padding: 30px;
      background: #111;
      border-radius: 18px;
    }

    h1 {
      color: #0066ff;
      text-align: center;
    }

    .campo {
      margin: 18px 0;
    }

    label {
      display: block;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 13px;
      box-sizing: border-box;
      background: #050505;
      color: white;
      border: 1px solid #444;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #0066ff;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #mensagem {
      text-align: center;
      margin-top: 18px;
    }

    .voltar {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #1680ff;
    }
  </style>
</head>

<body>

  <main class="endereco-container">
    <h1>Endereço de entrega</h1>

    <form id="form-endereco">

      <div class="campo">
        <label for="cep">CEP</label>
        <input id="cep" required maxlength="9"
          placeholder="00000-000">
      </div>

      <div class="campo">
        <label for="rua">Rua</label>
        <input id="rua" required maxlength="150">
      </div>

      <div class="campo">
        <label for="numero">Número</label>
        <input id="numero" required maxlength="20">
      </div>

      <div class="campo">
        <label for="complemento">Complemento</label>
        <input id="complemento" maxlength="100">
      </div>

      <div class="campo">
        <label for="bairro">Bairro</label>
        <input id="bairro" required maxlength="100">
      </div>

      <div class="campo">
        <label for="cidade">Cidade</label>
        <input id="cidade" required maxlength="100">
      </div>

      <div class="campo">
        <label for="estado">Estado (UF)</label>
        <input id="estado" required maxlength="2"
          placeholder="SP">
      </div>

      <button type="submit" id="btn-salvar">
        Salvar endereço
      </button>

    </form>

    <div id="mensagem" role="status" aria-live="polite"></div>

    <a href="index.html" class="voltar">
      ← Voltar à loja
    </a>
  </main>

  <script type="module">
    import { createClient } from
      "https://esm.sh/@supabase/supabase-js@2";

    const supabase = createClient(
      "https://fgdxxygtjjmmtummldne.supabase.co",
      "sb_publishable_qf6-r8Ucqxgz0J1ABzEHug_YxGc8MP8"
    );

    const formulario = document.getElementById("form-endereco");
    const mensagem = document.getElementById("mensagem");
    const botao = document.getElementById("btn-salvar");

    async function verificarLogin() {
      const { data, error } = await supabase.auth.getUser();

      if (error || !data.user) {
        window.location.href = "login.html";
        return null;
      }

      return data.user;
    }

    const usuario = await verificarLogin();

    if (usuario) {
      formulario.addEventListener("submit", async (event) => {
        event.preventDefault();

        botao.disabled = true;
        botao.textContent = "Salvando...";
        mensagem.textContent = "";

        const endereco = {
          user_id: usuario.id,
          cep: document.getElementById("cep").value.trim(),
          rua: document.getElementById("rua").value.trim(),
          numero: document.getElementById("numero").value.trim(),
          complemento: document.getElementById("complemento").value.trim(),
          bairro: document.getElementById("bairro").value.trim(),
          cidade: document.getElementById("cidade").value.trim(),
          estado: document.getElementById("estado").value.trim().toUpperCase(),
          principal: true
        };

        try {
          if (!/^\d{5}-?\d{3}$/.test(endereco.cep)) {
            throw new Error("Digite um CEP válido.");
          }

          if (!/^[A-Z]{2}$/.test(endereco.estado)) {
            throw new Error("Digite uma UF válida, como SP.");
          }

          const { error } = await supabase
            .from("addresses")
            .insert(endereco);

          if (error) throw error;

          mensagem.style.color = "#00cc66";
          mensagem.textContent = "Endereço salvo com sucesso!";

          formulario.reset();

        } catch (error) {
          mensagem.style.color = "#ff6666";
          mensagem.textContent =
            "Erro ao salvar: " + error.message;

        } finally {
          botao.disabled = false;
          botao.textContent = "Salvar endereço";
        }
      });
    }
  </script>

</body>
</html>
