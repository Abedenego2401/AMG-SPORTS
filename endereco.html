
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu endereço - AMG Sports</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .endereco-container {
      max-width: 500px;
      margin: 100px auto 50px;
      padding: 30px;
      background: #111;
      border-radius: 18px;
    }

    .endereco-container h1 {
      color: #0066ff;
      text-align: center;
    }

    .campo {
      margin: 15px 0;
    }

    .campo label {
      display: block;
      margin-bottom: 7px;
    }

    .campo input {
      width: 100%;
      padding: 12px;
      box-sizing: border-box;
      border: 1px solid #444;
      border-radius: 8px;
      background: #050505;
      color: white;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #0066ff;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #mensagem {
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <main class="endereco-container">
    <h1>Meu endereço</h1>

    <form id="form-endereco">

      <div class="campo">
        <label for="cep">CEP</label>
        <input id="cep" required maxlength="9" placeholder="00000-000">
      </div>

      <div class="campo">
        <label for="rua">Rua</label>
        <input id="rua" required>
      </div>

      <div class="campo">
        <label for="numero">Número</label>
        <input id="numero" required>
      </div>

      <div class="campo">
        <label for="complemento">Complemento</label>
        <input id="complemento">
      </div>

      <div class="campo">
        <label for="bairro">Bairro</label>
        <input id="bairro" required>
      </div>

      <div class="campo">
        <label for="cidade">Cidade</label>
        <input id="cidade" required>
      </div>

      <div class="campo">
        <label for="estado">Estado</label>
        <input id="estado" required maxlength="2" placeholder="SP">
      </div>

      <button type="submit" id="btn-salvar">
        Salvar endereço
      </button>

    </form>

    <p id="mensagem" role="status" aria-live="polite"></p>
  </main>

  <script type="module">
    import { createClient } from
      "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL =
      "https://yjlbkermtbnbrhfnbywy.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_nbg_3n1Z9u3fs4DM_i3j4Q_W03ULN4E";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const mensagem = document.getElementById("mensagem");
    const formulario = document.getElementById("form-endereco");
    const botao = document.getElementById("btn-salvar");

    async function verificarUsuario() {
      const { data, error } = await supabase.auth.getUser();

      if (error || !data.user) {
        window.location.href = "login.html";
        return null;
      }

      return data.user;
    }

    formulario.addEventListener("submit", async (event) => {
      event.preventDefault();

      botao.disabled = true;
      botao.textContent = "Salvando...";
      mensagem.textContent = "";

      try {
        const usuario = await verificarUsuario();

        if (!usuario) return;

        const endereco = {
          user_id: usuario.id,
          cep: document.getElementById("cep").value.trim(),
          rua: document.getElementById("rua").value.trim(),
          numero: document.getElementById("numero").value.trim(),
          complemento: document.getElementById("complemento").value.trim(),
          bairro: document.getElementById("bairro").value.trim(),
          cidade: document.getElementById("cidade").value.trim(),
          estado: document.getElementById("estado").value.trim().toUpperCase()
        };

        const { error } = await supabase
          .from("addresses")
          .insert(endereco);

        if (error) throw error;

        mensagem.style.color = "#00cc66";
        mensagem.textContent = "Endereço salvo com sucesso! Voltando para a loja...";

        formulario.reset();

        // Voltar para a página principal após 2 segundos
        setTimeout(() => {
          window.location.href = "index.html";
        }, 2000);

      } catch (error) {
        mensagem.style.color = "#ff6666";
        mensagem.textContent = "Erro ao salvar: " + error.message;

      } finally {
        botao.disabled = false;
        botao.textContent = "Salvar endereço";
      }
    });

    verificarUsuario();
  </script>

</body>
</html>
