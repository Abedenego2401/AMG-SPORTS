
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar - AMG Sports</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .login-container {
      max-width: 450px;
      margin: 120px auto 50px;
      padding: 30px;
      background: #111;
      border-radius: 18px;
    }

    .login-container h1 {
      color: #0066ff;
      text-align: center;
      margin-bottom: 25px;
    }

    .campo {
      margin-bottom: 20px;
    }

    .campo label {
      display: block;
      margin-bottom: 8px;
    }

    .campo input {
      width: 100%;
      padding: 13px;
      border: 1px solid #444;
      border-radius: 8px;
      background: #050505;
      color: white;
      box-sizing: border-box;
    }

    .login-container button {
      width: 100%;
      padding: 14px;
      background: #0066ff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-container button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #mensagem {
      text-align: center;
      margin-top: 18px;
      line-height: 1.5;
    }

    .links {
      text-align: center;
      margin-top: 20px;
      line-height: 2;
    }

    .links a {
      color: #1680ff;
    }
  </style>
</head>

<body>

  <main class="login-container">
    <h1>Entrar na minha conta</h1>

    <form id="form-login">

      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" required
          autocomplete="email" placeholder="Digite seu e-mail">
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" required
          autocomplete="current-password"
          placeholder="Digite sua senha">
      </div>

      <button type="submit" id="btn-login">
        Entrar
      </button>

    </form>

    <div id="mensagem" role="status" aria-live="polite"></div>

    <div class="links">
      Ainda não tem conta?
      <a href="cadastro.html">Criar conta</a>
      <br>
      <a href="index.html">← Voltar à loja</a>
    </div>
  </main>

  <script type="module">
    import { createClient } from
      "https://esm.sh/@supabase/supabase-js@2";

    // PROJETO CORRETO AMG-SPORTS
    const SUPABASE_URL =
      "https://yjlbkermtbnbrhfnbywy.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_nbg_3n1Z9u3fs4DM_i3j4Q_W03ULN4E";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const formulario = document.getElementById("form-login");
    const mensagem = document.getElementById("mensagem");
    const botao = document.getElementById("btn-login");

    formulario.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value;

      botao.disabled = true;
      botao.textContent = "Entrando...";
      mensagem.textContent = "";

      try {
        const { data, error } =
          await supabase.auth.signInWithPassword({
            email,
            password: senha
          });

        if (error) throw error;

        if (!data.session) {
          throw new Error("Não foi possível iniciar sua sessão.");
        }

        mensagem.style.color = "#00cc66";
        mensagem.textContent = "Login realizado com sucesso!";

        // REDIRECIONAR PARA MINHA CONTA
        window.location.href = "minha-conta.html";

      } catch (error) {
        mensagem.style.color = "#ff6666";
        mensagem.textContent =
          "Erro ao entrar: " + error.message;

      } finally {
        botao.disabled = false;
        botao.textContent = "Entrar";
      }
    });
  </script>

</body>
</html>
